name: Release quality
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      APP_VARIANT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run check:source
      - run: npm test
      - run: npm run check:expo
      - run: npm run export:android
      - name: Publish dependency advisory report
        run: npm audit --json > app-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-dependency-audit
          path: app-audit.json
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm --prefix functions test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
